name: Daily Current Affairs 7:00 AM IST Cron

on:
  schedule:
    # 01:30 UTC = 07:00 AM IST every day
    - cron: '30 1 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  generate-daily-ca:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Daily CA Generator API
        run: |
          curl -X POST https://www.upscsphere.in/api/daily-ca/cron \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -f || echo "Trigger sent to production"
